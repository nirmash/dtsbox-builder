# Example: eternal workflow (uncomment and adapt to enable)
# A workflow with eternal: true auto-starts as a singleton on worker boot.
# Its orchestrator MUST call ctx.continue_as_new(...) or history grows unbounded.
# workflows:
#   my-poller:
#     eternal: true
#     orchestrator: my_module.my_poller

